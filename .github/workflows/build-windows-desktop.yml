name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build NSIS and portable executables
        run: npm run desktop:dist:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist-desktop -Filter *.exe |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii dist-desktop/SHA256SUMS.txt

      - name: Upload Windows installers
        uses: actions/upload-artifact@v6
        with:
          name: LoopWork-Windows-x64-${{ github.run_number }}
          path: |
            dist-desktop/*.exe
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
